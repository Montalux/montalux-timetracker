name: Daily Supabase Backup

on:
  schedule:
    # Täglich um 02:00 UTC (03:00 Schweizer Zeit / 04:00 Sommerzeit)
    - cron: '0 2 * * *'
  workflow_dispatch: # Manuell auslösbar via GitHub UI

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export all tables from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 .github/scripts/backup_supabase.py

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backup/
          retention-days: 30
